name: VIP regression
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y verilator
      - name: verilator -Wall on every RTL block
        run: for f in */rtl/*.v; do echo "== $f"; verilator --lint-only -Wall "$f"; done

  sim:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        block: [apb, axi4lite, uart, spi, i2c, async_fifo]
        seed: [1, 2, random]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: pip install "cocotb>=2.0,<3"
      - name: cocotb regression
        run: |
          if [ "${{ matrix.seed }}" != random ]; then export SEED=${{ matrix.seed }}; fi
          set -o pipefail
          make -C ${{ matrix.block }}/tb 2>&1 | tee sim.log
      - run: "! grep -q '<failure' ${{ matrix.block }}/tb/results.xml"
      - name: coverage summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.block }}, seed ${{ matrix.seed }}"
            grep -oE 'SEED=[0-9]+' sim.log | head -1 || true
            echo
            grep -E 'coverage [0-9.]+%' sim.log | sed -E 's/^ *[0-9.]+ns +INFO +[^ ]+ +/- /' || true
            grep -E 'TESTS=' sim.log | sed -E 's/^ *\*\* */- /; s/ *\*\*$//' || true
          } >> "$GITHUB_STEP_SUMMARY"

  formal:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        block: [fifo, axi4lite, async_fifo]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y yosys z3
      - name: BMC, k-induction and cover
        run: make -C ${{ matrix.block }}/formal

  mutation:
    runs-on: ubuntu-24.04
    needs: [sim, formal]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y iverilog yosys z3
      - run: pip install "cocotb>=2.0,<3"
      - name: every injected bug must be caught
        run: python3 tools/mutate.py --report mutation.md
      - if: always()
        run: cat mutation.md >> "$GITHUB_STEP_SUMMARY"
